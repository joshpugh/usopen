<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}

/* Layout: quiet sticky game strip over a two-column tale of the tape; one column on phones. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --ink: #18202b; --muted: #6b7482; --line: #e3e6ea;
  --a: #2457a6; --b: #b4511f; --win: #1d7a45; --loss: #b8382f; --draw: #94700f;
  --font: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e1319; --surface: #151c24; --ink: #e6eaef; --muted: #8d97a4; --line: #242e39; --a: #7ea8ec; --b: #ec9a6c; --win: #5cc58a; --loss: #ee7d73; --draw: #d9b35a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e1319; --surface: #151c24; --ink: #e6eaef; --muted: #8d97a4; --line: #242e39; --a: #7ea8ec; --b: #ec9a6c; --win: #5cc58a; --loss: #ee7d73; --draw: #d9b35a; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; font-weight: 400; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1100px; margin: 0 auto; }
b, strong { font-weight: 600; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { padding-block: 8px; }
.pills { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: 0 0 auto; min-height: 44px; padding: 4px 10px; border-radius: 8px; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; font: inherit; line-height: 1.2; }
.pill .pt { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
.pill .ps { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pill.done { opacity: .5; }
.pill.now .pt::after { content: " ●"; color: var(--loss); font-size: 9px; vertical-align: 2px; }
.pill[aria-current="true"] { background: var(--ink); color: var(--bg); opacity: 1; }
.pill[aria-current="true"] .ps { color: var(--bg); opacity: .75; }
.pill:focus-visible, .seg button:focus-visible, .ladder-row:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }

main .wrap { padding-block: 16px 40px; }
.head { margin-bottom: 10px; }
.eyebrow { font-size: 13px; color: var(--muted); }
.round { font-size: 15px; }
.matchup { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: baseline; gap: 10px; margin: 6px 0 14px; }
.matchup .tn { font-size: 22px; font-weight: 600; line-height: 1.15; min-width: 0; }
.matchup .tn small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.matchup .ta { color: var(--a); }
.matchup .tb { color: var(--b); text-align: right; }
.vs { color: var(--muted); font-size: 13px; }

.pick { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; align-items: center; margin: 4px 0 6px; }
.pick-lbl { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.pick-row { display: contents; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.seg button { flex: 1 1 0; min-width: 0; min-height: 40px; border: 0; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button + button { border-left: 1px solid var(--line); }
.seg.sa button[aria-pressed="true"] { background: var(--a); color: #fff; }
.seg.sb button[aria-pressed="true"] { background: var(--b); color: #fff; }

.grid { display: grid; gap: 22px; }
@media (min-width: 820px) { .grid { grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 32px; align-items: start; } }
.col { display: grid; gap: 22px; min-width: 0; }
.card { min-width: 0; }
.card h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.tape { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); border-top: 1px solid var(--line); }
.tape > div { padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.tape .va { text-align: right; padding-right: 12px; }
.tape .vb { text-align: left; padding-left: 12px; }
.tape .lb { text-align: center; font-size: 12px; color: var(--muted); padding: 7px 4px 0; max-width: 8rem; line-height: 1.2; }
.tape .v { font-variant-numeric: tabular-nums; }
.res { font-variant-numeric: tabular-nums; white-space: nowrap; }
.res b { display: inline-block; width: 1.1em; }
.res.W b { color: var(--win); } .res.L b { color: var(--loss); } .res.D b { color: var(--draw); }
.nil { color: var(--muted); }

.form { display: grid; gap: 6px; }
.frow { display: grid; grid-template-columns: 6.5rem 1fr; align-items: center; gap: 8px; }
.frow .fn { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow.a .fn { color: var(--a); } .frow.b .fn { color: var(--b); }
.dots { display: flex; flex-wrap: wrap; gap: 3px; }
.dots span { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: #fff; }
.dots .W { background: var(--win); } .dots .L { background: var(--loss); } .dots .D { background: var(--draw); }
.dots .sun { outline: 1.5px solid var(--ink); outline-offset: 1px; }

.story { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.tcard h3 { color: var(--ink); font-size: 15px; font-weight: 600; letter-spacing: 0; text-transform: none; padding-bottom: 4px; border-bottom: 2px solid currentColor; }
.tcard.a h3 { color: var(--a); } .tcard.b h3 { color: var(--b); }
.tbody { display: grid; gap: 10px; }
.sub { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.watch, .say { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.watch .why { color: var(--muted); }
.say .ph { font-style: italic; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

.soon-card { display: grid; gap: 6px; padding-top: 8px; }
.soon-card .big { font-size: 20px; font-weight: 600; }
.soon-card p { margin: 0; color: var(--muted); }

.ladders { display: grid; gap: 28px; }
@media (min-width: 820px) { .ladders { grid-template-columns: 1fr 1fr; align-items: start; } }
.ladder-head, .ladder-row { display: grid; grid-template-columns: 1.6rem minmax(0,1fr) 4.2rem 2.8rem 2.4rem; gap: 6px; align-items: center; }
.ladder-head { padding: 4px 0; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.ladder-head span:nth-child(n+3) { text-align: right; }
.ladder-row { width: 100%; min-height: 40px; padding: 6px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; font: inherit; cursor: pointer; }
.ladder-row .pos { color: var(--muted); font-variant-numeric: tabular-nums; }
.ladder-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ladder-row .num { text-align: right; font-variant-numeric: tabular-nums; }
.ladder-row .gd { color: var(--muted); }
.ladder-row .pts { font-weight: 600; }
.lres { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 0 10px 1.6rem; border-bottom: 1px solid var(--line); font-size: 14px; }
.lres .opp { color: var(--muted); }

.embed { position: relative; width: 100%; aspect-ratio: 1557 / 80; overflow: hidden; background: #000; }
.embed iframe { position: absolute; top: 0; left: 0; width: 1557px; height: 80px; border: 0; transform-origin: 0 0; transform: scale(var(--sbs, 1)); }
</style>

function bindLadder() {
  document.querySelectorAll('.ladder-row').forEach(b => b.addEventListener('click', () => {
    const p = b.nextElementSibling; p.hidden = !p.hidden; b.setAttribute('aria-expanded', String(!p.hidden));
  }));
}

function tick() {
  const n = nowPT();
  const h = Math.floor(n / 60), m = n % 60;
  document.getElementById('clock').textContent = `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}`;
  const nxt = slots.find(s => s.min > n);
  const cur = slots.find(s => n >= s.min && n < s.min + 30);
  document.getElementById('next').textContent = cur ? `G${cur.no} on now` : nxt ? `G${nxt.no} in ${nxt.min - n}m` : 'PT';
}

function fromHash() {
  const h = (location.hash || '').replace('#', '');
  if (h === 'ladder') return 'ladder';
  const m = /^g(\d+)$/.exec(h);
  if (m && slots.find(s => s.no === +m[1])) return +m[1];
  return null;
}
window.addEventListener('hashchange', () => { const h = fromHash(); if (h !== null && h !== state.slot) go(h, true); });
setInterval(() => { renderPills(); }, 60000);
go(fromHash() ?? currentSlot().no, true);
</script>

</body>
