<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Court 1 Call Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}

/* Layout: quiet sticky game strip over a two-column tale of the tape; one column on phones. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --ink: #18202b; --muted: #6b7482; --line: #e3e6ea;
  --a: #2457a6; --b: #b4511f; --win: #1d7a45; --loss: #b8382f; --draw: #94700f;
  --font: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e1319; --surface: #151c24; --ink: #e6eaef; --muted: #8d97a4; --line: #242e39; --a: #7ea8ec; --b: #ec9a6c; --win: #5cc58a; --loss: #ee7d73; --draw: #d9b35a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e1319; --surface: #151c24; --ink: #e6eaef; --muted: #8d97a4; --line: #242e39; --a: #7ea8ec; --b: #ec9a6c; --win: #5cc58a; --loss: #ee7d73; --draw: #d9b35a; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; font-weight: 400; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1100px; margin: 0 auto; }
b, strong { font-weight: 600; }

.bar { position: fixed; top: calc(2px + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
body { padding-top: calc(2px + 6.2vw + 64px); }
html { scroll-padding-top: var(--barh, 120px); }
.bar .wrap { padding-block: 8px; }
.pills { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: 0 0 auto; min-height: 44px; padding: 4px 10px; border-radius: 8px; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; font: inherit; line-height: 1.2; }
.pill .pt { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
.pill .ps { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pill.done { opacity: .5; }
.pill.now .pt::after { content: " ●"; color: var(--loss); font-size: 9px; vertical-align: 2px; }
.pill[aria-current="true"] { background: var(--ink); color: var(--bg); opacity: 1; }
.pill[aria-current="true"] .ps { color: var(--bg); opacity: .75; }
.pill:focus-visible, .seg button:focus-visible, .ladder-row:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }

main .wrap { padding-block: 16px 40px; }
.head { margin-bottom: 10px; }
.eyebrow { font-size: 13px; color: var(--muted); }
.round { font-size: 15px; }
.mic { font-size: 14px; color: var(--muted); }
.matchup { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: baseline; gap: 10px; margin: 6px 0 14px; }
.matchup .tn { font-size: 22px; font-weight: 600; line-height: 1.15; min-width: 0; }
.matchup .tn small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.matchup .ta { color: var(--a); }
.matchup .tb { color: var(--b); text-align: right; }
.vs { color: var(--muted); font-size: 13px; }

.pick { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; align-items: center; margin: 4px 0 6px; }
.pick-lbl { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.pick-row { display: contents; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.seg button { flex: 1 1 0; min-width: 0; min-height: 40px; border: 0; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button + button { border-left: 1px solid var(--line); }
.seg.sa button[aria-pressed="true"] { background: var(--a); color: #fff; }
.seg.sb button[aria-pressed="true"] { background: var(--b); color: #fff; }

.grid { display: grid; gap: 22px; }
@media (min-width: 820px) { .grid { grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 32px; align-items: start; } }
.col { display: grid; gap: 22px; min-width: 0; }
.card { min-width: 0; }
.card h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.tape { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); border-top: 1px solid var(--line); }
.tape > div { padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.tape .va { text-align: right; padding-right: 12px; }
.tape .vb { text-align: left; padding-left: 12px; }
.tape .lb { text-align: center; font-size: 12px; color: var(--muted); padding: 7px 4px 0; max-width: 8rem; line-height: 1.2; }
.tape .v { font-variant-numeric: tabular-nums; }
.res { font-variant-numeric: tabular-nums; white-space: nowrap; }
.res b { display: inline-block; width: 1.1em; }
.res.W b { color: var(--win); } .res.L b { color: var(--loss); } .res.D b { color: var(--draw); }
.nil { color: var(--muted); }

.form { display: grid; gap: 6px; }
.frow { display: grid; grid-template-columns: 6.5rem 1fr; align-items: center; gap: 8px; }
.frow .fn { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow.a .fn { color: var(--a); } .frow.b .fn { color: var(--b); }
.dots { display: flex; flex-wrap: wrap; gap: 3px; }
.dots span { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: #fff; }
.dots .W { background: var(--win); } .dots .L { background: var(--loss); } .dots .D { background: var(--draw); }
.dots .sun { outline: 1.5px solid var(--ink); outline-offset: 1px; }

.story { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.tcard h3 { color: var(--ink); font-size: 15px; font-weight: 600; letter-spacing: 0; text-transform: none; padding-bottom: 4px; border-bottom: 2px solid currentColor; }
.tcard.a h3 { color: var(--a); } .tcard.b h3 { color: var(--b); }
.tbody { display: grid; gap: 10px; }
.sub { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.watch, .say { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.watch .why { color: var(--muted); }
.say .ph { font-style: italic; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

.soon-card { display: grid; gap: 6px; padding-top: 8px; }
.soon-card .big { font-size: 20px; font-weight: 600; }
.soon-card p { margin: 0; color: var(--muted); }

.ladders { display: grid; gap: 28px; }
@media (min-width: 820px) { .ladders { grid-template-columns: 1fr 1fr; align-items: start; } }
.ladder-head, .ladder-row { display: grid; grid-template-columns: 1.6rem minmax(0,1fr) 4.2rem 2.8rem 2.4rem; gap: 6px; align-items: center; }
.ladder-head { padding: 4px 0; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.ladder-head span:nth-child(n+3) { text-align: right; }
.ladder-row { width: 100%; min-height: 40px; padding: 6px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; font: inherit; cursor: pointer; }
.ladder-row .pos { color: var(--muted); font-variant-numeric: tabular-nums; }
.ladder-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ladder-row .num { text-align: right; font-variant-numeric: tabular-nums; }
.ladder-row .gd { color: var(--muted); }
.ladder-row .pts { font-weight: 600; }
.lres { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 0 10px 1.6rem; border-bottom: 1px solid var(--line); font-size: 14px; }
.lres .opp { color: var(--muted); }

.embed { position: relative; width: 100%; aspect-ratio: 1557 / 80; overflow: hidden; background: #000; }
.embed iframe { position: absolute; top: 0; left: 0; width: 1557px; height: 80px; border: 0; transform-origin: 0 0; transform: scale(var(--sbs, 1)); }

/* Desk layout: laptop on the commentary desk, glance-down dashboard */
.dash { display: none; }
@media (min-width: 1024px) {
  .lstory li { font-size: 18px; }

  body { font-size: 17px; }
  .wrap { max-width: none; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
  .pill .pt { font-size: 16px; } .pill .ps { font-size: 13px; }
  main .wrap { padding-block: 14px 24px; }
  .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .eyebrow { font-size: 15px; } .round { font-size: 18px; }
  .mobile { display: none; }
  .pick { max-width: 720px; }
  .dash { display: grid; gap: 16px; }
  .dstory { margin: 0; padding: 12px 18px 12px 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; font-size: 19px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .dgrid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr); gap: 24px; align-items: start; }
  .panel { display: grid; gap: 16px; min-width: 0; padding: 16px 18px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; border-top: 4px solid var(--a); }
  .panel.b { border-top-color: var(--b); }
  .pname { font-size: 34px; font-weight: 600; line-height: 1.05; color: var(--a); }
  .panel.b .pname { color: var(--b); }
  .pname small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 4px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .kpi.wide { grid-column: 1 / -1; }
  .kl { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .kv { font-size: 26px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .kpi.wide .kv { font-size: 20px; }
  .kv .res b { width: auto; margin-right: 4px; }
  .dots.big { gap: 5px; }
  .dots.big span { width: 26px; height: 26px; font-size: 12px; }
  .pbody { display: grid; gap: 12px; font-size: 16px; }
  .dmid { min-width: 0; }
  .dmid h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .dmid .tape > div { padding: 5px 0; }
  .dmid .tape .v { font-size: 18px; }
  .dmid .tape .lb { font-size: 13px; padding-top: 7px; }
  .ladders { gap: 40px; }
}
@media (min-width: 1500px) { body { font-size: 18px; } .kv { font-size: 30px; } .pname { font-size: 40px; } .dstory { font-size: 21px; } }

/* Overflow guards for long team names */
.res { white-space: normal; }
.tape > div, .kv, .kl, .pname, .tn, .watch li, .say li, .notes li, .story li, .dstory li, .tcard h3, .ladder-row .nm, .lres .res { overflow-wrap: anywhere; min-width: 0; }
.frow { grid-template-columns: minmax(0, 6.5rem) minmax(0, 1fr); }
.kpis { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.kpi { min-width: 0; }
.panel > *, .pbody > *, .tbody > *, .col > *, .dash > * { min-width: 0; }
main, main .wrap, .grid, .dgrid { min-width: 0; max-width: 100%; }
html, body { overflow-x: hidden; overflow-x: clip; }

.pred { display: grid; gap: 6px; }
.pred h3 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pred-nums { display: flex; justify-content: space-between; gap: 8px; font-size: 16px; font-weight: 500; }
.pred-nums .pa { color: var(--a); } .pred-nums .pb { color: var(--b); text-align: right; }
.pred-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.pred-bar .pa { background: var(--a); } .pred-bar .pb { background: var(--b); }
.pred-why { margin: 0; font-size: 14px; color: var(--muted); }
.pred-res { font-size: 18px; } .pred-res b { font-weight: 600; }
.tfcard { display: none; }
@media (min-width: 820px) and (max-width: 1023px) { .mobile .grid { grid-template-columns: minmax(0,1fr); } .grid .rw-tf { order: -1; } }
@media (min-width: 1024px) and (max-width: 1366px) { .kpi-tf { grid-column: 1 / -1; order: -1; } .kpi-tf .kv { font-size: 18px; line-height: 1.35; } }
.pred-pre { font-size: 14.5px; font-weight: 400; color: var(--muted); text-align: center; }
.pred-live { font-size: 11px; letter-spacing: .06em; color: var(--a); margin-left: 4px; }
.lstory { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.lstory h3 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lstory ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.lstory li { font-size: 15px; line-height: 1.35; padding-left: 12px; position: relative; }
.lstory li::before { content: ""; position: absolute; left: 0; top: .55em; width: 5px; height: 5px; border-radius: 50%; background: var(--a); }
.lstory ul { max-height: 17.5em; overflow-y: auto; overscroll-behavior: contain; }
.lstory .ls-t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85em; margin-right: 2px; }
.lstory li { border-radius: 4px; }
.lstory li.fresh { animation: lsfresh 4s ease-out; }
@keyframes lsfresh { from { background: color-mix(in srgb, var(--a) 24%, transparent); } to { background: transparent; } }
.dmid .pred { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.dmid .pred h3 { text-align: center; }
@media (min-width: 1024px) { .pred-nums { font-size: 20px; } .pred-bar { height: 10px; } .pred-why { font-size: 16px; text-align: center; } }
.tick { display: flex; align-items: center; gap: 12px; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.tk-score { display: flex; align-items: baseline; gap: 10px; flex: 1 1 auto; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; }
.tk-score b { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 18px; }
.tk-score i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 6px; vertical-align: middle; }
.tk-h, .tk-a { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tk-p { color: var(--muted); font-size: 13px; margin-left: auto; }
.tk-worm { flex: 0 0 110px; width: 110px; height: 28px; }
.tk-zero { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.tk-line { fill: none; stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
@media (min-width: 1024px) { .tick { padding-block: 6px; } .tk-score { font-size: 18px; } .tk-score b { font-size: 24px; } .tk-worm { flex-basis: 260px; width: 260px; height: 36px; } }
.verbar { position: fixed; top: 0; left: 0; right: 0; height: calc(2px + env(safe-area-inset-top, 0px)); z-index: 30; background: var(--ver, var(--muted)); box-shadow: var(--vershadow, none); pointer-events: none; }

/* Starting lineups map */
.lineup { min-height: 100svh; display: flex; flex-direction: column; gap: 14px; margin-top: 28px; padding-block: 20px 28px; border-top: 1px solid var(--line); }
.lineup > h2 { margin: 0; font-size: 20px; text-align: center; }
.ln-key { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; font-weight: 700; font-size: 15px; }
.ln-key .a { color: var(--a); } .ln-key .b { color: var(--b); }
.ln-court { display: flex; justify-content: center; }
.ln-court svg { width: 100%; height: auto; max-height: 78svh; display: block; }
.ln-wide, .ln-key .w { display: none; }
@media (min-width: 700px) { .ln-tall, .ln-key .t { display: none; } .ln-wide { display: block; } .ln-key .w { display: inline; } .ln-court svg { max-height: 70svh; } }
.ln-teams { display: grid; gap: 12px; grid-template-columns: minmax(0,1fr); }
@media (min-width: 700px) { .ln-teams { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
.ln-team { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.ln-team h3 { margin: 0 0 6px; font-size: 16px; } .ln-team.a h3 { color: var(--a); } .ln-team.b h3 { color: var(--b); }
.ln-team p { margin: 4px 0 0; font-size: 15px; line-height: 1.45; } .ln-team p b { color: var(--muted); font-weight: 600; }
@media (min-width: 1024px) { .lineup > h2 { font-size: 26px; } .ln-key { font-size: 18px; } .ln-team p { font-size: 17px; } .ln-team h3 { font-size: 19px; } }
.ln-notes { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 7px; }
.ln-notes li { display: grid; grid-template-columns: 2.6em minmax(0,1fr); gap: 8px; font-size: 15px; line-height: 1.4; align-items: baseline; }
.ln-notes .lpos { font-size: 11px; font-weight: 800; color: #fff; text-align: center; border-radius: 4px; padding: 2px 0; }
.ln-team.a .lpos { background: var(--a); } .ln-team.b .lpos { background: var(--b); }
.ln-notes b { color: var(--ink); }
@media (min-width: 1024px) { .ln-notes li { font-size: 17px; } }
</style>
</head>
<body>

<div class="verbar" id="verbar" aria-hidden="true"></div>
<header class="bar">
  <div class="embed" id="embed"><iframe src="https://keepthescore.com/board/ydsdbqxxnznkr?public=true" title="Live scoreboard and clock" scrolling="no"></iframe></div>
  <script>(function(){var e=document.getElementById('embed');function fit(){e.style.setProperty('--sbs',e.clientWidth/1557)}fit();window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(e);})();</script>
  <div class="tick" id="tick" hidden><div class="tk-score" id="tkScore"></div><svg class="tk-worm" id="tkWorm" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <script>(function(){
  var URL_='https://keepthescore.com/api/v1/sport/ydsdbqxxnznkr/',KEY='c1worm',box=document.getElementById('tick'),sc=document.getElementById('tkScore'),svg=document.getElementById('tkWorm');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
  function col(c){return /^#[0-9a-f]{6}/i.test(c||'')?c.slice(0,7):'';}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
  function save(w){try{localStorage.setItem(KEY,JSON.stringify(w))}catch(e){}}
  function draw(w,hc,ac){var s=w.s.slice();if(!s.length){svg.innerHTML='';return;}var lp=s[s.length-1];if(w.e&&w.e>lp[0])s.push([w.e,lp[1],lp[2]]);if(s.length<2){svg.innerHTML='';return;}
    var t0=s[0][0],t1=s[s.length-1][0],dt=Math.max(1,t1-t0),mx=3;s.forEach(function(p){mx=Math.max(mx,Math.abs(p[1]-p[2]))});
    var X=function(t){return (t-t0)/dt*200},Y=function(m){return 20-m/mx*18};
    var d='M0 20',line='';var py=null;s.forEach(function(p,i){var x=X(p[0]).toFixed(1),y=Y(p[1]-p[2]).toFixed(1);if(py!==null){d+=' L'+x+' '+py;line+=' L'+x+' '+py;}d+=' L'+x+' '+y;line+=(i?' L':'M')+x+' '+y;py=y;});d+=' L200 20 Z';
    svg.innerHTML='<defs><clipPath id="tkUp"><rect x="0" y="0" width="200" height="20"/></clipPath><clipPath id="tkDn"><rect x="0" y="20" width="200" height="20"/></clipPath></defs>'+
      '<line x1="0" y1="20" x2="200" y2="20" class="tk-zero"/>'+
      '<path d="'+d+'" clip-path="url(#tkUp)" style="fill:'+(hc||'var(--a)')+';opacity:.45"/>'+
      '<path d="'+d+'" clip-path="url(#tkDn)" style="fill:'+(ac||'var(--b)')+';opacity:.45"/>'+
      '<path d="'+line+'" class="tk-line"/>';}
  var busy=false;
  function poll(){if(busy||document.hidden)return;busy=true;
